# Builds the drivers' Android app (fleet/android). The APK is attached to each run under "Artifacts".
name: Driver app (Android)

on:
  push:
    paths:
      - "fleet/android/**"
      - "fleet/firebase-config.json"
      - ".github/workflows/driver-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk rafiq-driver.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-driver
          path: fleet/android/rafiq-driver.apk
